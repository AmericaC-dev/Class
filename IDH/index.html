<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDH de mi estado</title>
<style>
  :root {
    --bg: #e9f1ea;
    --surface: #fbfdf9;
    --ink: #1d2b24;
    --muted: #4d6157;
    --forest: #1f5a3f;
    --forest-dark: #164430;
    --river: #2a7f86;
    --line: #b9cdbd;
    --result-bg: #dcebe7;
    --focus: #0e6f78;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1c16;
      --surface: #172a21;
      --ink: #e3efe6;
      --muted: #a4baac;
      --forest: #4fa77b;
      --forest-dark: #6cc197;
      --river: #5ab8c0;
      --line: #2f4a3d;
      --result-bg: #12302f;
      --focus: #7dd3da;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  main { max-width: 640px; margin: 0 auto; }
  header {
    border-left: 6px solid var(--forest);
    padding-left: 16px;
    margin: 24px 0 28px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.1;
    margin: 0 0 8px;
    color: var(--forest);
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  select, button { font: inherit; width: 100%; min-height: 48px; border-radius: 10px; }
  select {
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 0 12px;
  }
  button {
    margin-top: 14px;
    border: 0;
    background: var(--forest);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--forest-dark); }
  button:disabled { opacity: 0.65; cursor: wait; }
  select:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #resultado {
    margin-top: 20px;
    padding: 16px;
    background: var(--result-bg);
    border: 1px solid var(--river);
    border-radius: 10px;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  #resultado.error { border-color: #b3402f; background: #f7e3df; color: #6b1f14; }
  @media (prefers-color-scheme: dark) {
    #resultado.error { background: #3a1d19; color: #f2c7c0; border-color: #d46a5a; }
  }
  [hidden] { display: none !important; }
  @media (min-width: 600px) {
    body { padding-top: 48px; }
    .card { padding: 28px; }
    .fila { display: flex; gap: 12px; align-items: flex-end; }
    .fila .campo { flex: 1; }
    button { width: auto; min-width: 160px; margin-top: 0; padding: 0 24px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>IDH de mi estado</h1>
    <p>El Índice de Desarrollo Humano (IDH) mide el bienestar de un territorio con tres dimensiones: salud (esperanza de vida), educación (años de escolaridad) y nivel de vida (ingreso). Va de 0 a 1; mientras más cerca de 1, mayor es el desarrollo humano.</p>
  </header>

  <section class="card">
    <form id="formulario">
      <div class="fila">
        <div class="campo">
          <label for="entidad">Elige tu entidad federativa</label>
          <select id="entidad" name="entidad" required>
            <option value="" selected disabled>Selecciona una entidad</option>
          </select>
        </div>
        <button type="submit" id="consultar">Consultar</button>
      </div>
    </form>
    <div id="resultado" role="status" aria-live="polite" hidden></div>
  </section>
</main>

<script>
  // Pega aquí la URL del webhook de Make (entre las comillas).
  const WEBHOOK_URL = "https://hook.eu1.make.com/pp17mmcuw43xeia5c9ilnj3ixhbs34y6";

  const ENTIDADES = [
    "Aguascalientes", "Baja California", "Baja California Sur", "Campeche",
    "Chiapas", "Chihuahua", "Ciudad de México", "Coahuila", "Colima",
    "Durango", "Guanajuato", "Guerrero", "Hidalgo", "Jalisco", "México",
    "Michoacán", "Morelos", "Nayarit", "Nuevo León", "Oaxaca", "Puebla",
    "Querétaro", "Quintana Roo", "San Luis Potosí", "Sinaloa", "Sonora",
    "Tabasco", "Tamaulipas", "Tlaxcala", "Veracruz", "Yucatán", "Zacatecas"
  ];

  const formulario = document.getElementById("formulario");
  const selector = document.getElementById("entidad");
  const boton = document.getElementById("consultar");
  const resultado = document.getElementById("resultado");

  ENTIDADES.slice().sort((a, b) => a.localeCompare(b, "es")).forEach((nombre) => {
    const opcion = document.createElement("option");
    opcion.value = nombre;
    opcion.textContent = nombre;
    selector.appendChild(opcion);
  });

  function mostrar(texto, esError) {
    resultado.textContent = texto;
    resultado.classList.toggle("error", Boolean(esError));
    resultado.hidden = false;
  }

  formulario.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    if (!selector.value) {
      mostrar("Selecciona una entidad federativa.", true);
      return;
    }

    boton.disabled = true;
    boton.textContent = "Consultando...";
    mostrar("Consultando...", false);

    try {
      const cuerpo = new URLSearchParams();
      cuerpo.append("entidad", selector.value);

      const respuesta = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: cuerpo
      });

      if (!respuesta.ok) {
        throw new Error("Respuesta " + respuesta.status);
      }

      const texto = await respuesta.text();
      mostrar(texto, false);
    } catch (error) {
      mostrar("No se pudo obtener la información, intenta de nuevo.", true);
    } finally {
      boton.disabled = false;
      boton.textContent = "Consultar";
    }
  });
</script>
</body>
</html>
